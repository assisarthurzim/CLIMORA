# Blueprint do Render: cria o backend (Flask) e o banco Postgres.
# Coloque este arquivo na RAIZ do repositório.
databases:
  - name: climora-db
    plan: free

services:
  - type: web
    name: climora-api          # a URL sera https://climora-api.onrender.com
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run db upgrade && gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: climora-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://SEU-SITE.vercel.app    # troque pela URL da Vercel
      - key: OPENAI_KEY
        sync: false            # voce preenche no painel do Render
      - key: OPENWEATHER_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
