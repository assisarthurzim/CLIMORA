[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The environment is selected by conftest, which calls create_app("testing").
addopts = "-q --strict-markers"
